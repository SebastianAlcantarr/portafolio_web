<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Linóleo — sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#E6D9BD;color:#121110;font-family:'Work Sans';overflow:hidden;position:relative}
.bar{background:#121110;color:#E6D9BD;padding:18px 48px;display:flex;justify-content:space-between;font:400 26px Anton;letter-spacing:.04em}
h1{position:absolute;left:44px;top:110px;font:400 250px/0.86 Anton;text-transform:uppercase;letter-spacing:-0.01em}
.block{position:absolute;right:48px;top:110px;width:520px;height:600px;background:#121110}
.block::after{content:'PLACA: RAYFORCE (duotono tinta)';position:absolute;left:24px;bottom:24px;color:#E6D9BD;font:400 30px Anton}
.role{position:absolute;left:48px;top:680px;font:400 46px Anton;text-transform:uppercase}
.btn{position:absolute;top:780px;padding:16px 28px;font:400 30px Anton;text-transform:uppercase}
.b1{left:48px;background:#121110;color:#E6D9BD}.b2{left:340px;border:4px solid #121110}
.red{color:#B3261E}
</style></head><body>
<div class="bar"><span>[TU_NOMBRE]</span><span>PROYECTOS · SOBRE MÍ · CONTACTO</span></div>
<h1>[TU_<br>NOMBRE]</h1>
<div class="block"></div>
<div class="role">Desarrollador web <span class="red">·</span> Vue, Nuxt, FastAPI</div>
<div class="btn b1">Ver proyectos</div><div class="btn b2">Contacto</div>
</body></html>
